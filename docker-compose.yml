services:
  ui:
    build: .
    container_name: meka-ui
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - chroma_data:/app/chroma_db
    restart: unless-stopped

  api:
    build: .
    container_name: meka-api
    command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - chroma_data:/app/chroma_db
    restart: unless-stopped

volumes:
  chroma_data:
