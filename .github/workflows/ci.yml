name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: flake8 rag api.py app.py --max-line-length=120 --extend-ignore=E203,W503

      - name: Run offline unit tests
        # These tests avoid live HF/Groq/Ollama calls so CI works without secrets.
        run: pytest tests/ -v
